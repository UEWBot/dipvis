name: Parser Sites Live Integration

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

jobs:
  live-parser-sites:
    name: ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      # One site being down shouldn't stop the others being checked
      fail-fast: false
      matrix:
        include:
          - site: Wikipedia
            tag: wikipedia_live
          - site: Backstabbr
            tag: backstabbr
          - site: World Diplomacy Reference
            tag: wdr
          - site: World Diplomacy Database
            tag: wdd
          # TODO: Add webdip once webdip can be accessed from github

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Live ${{ matrix.site }} Tests
        run: |
          cd visualiser
          python ./manage.py test --tag=${{ matrix.tag }}
