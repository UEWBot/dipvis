name: Django CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  core-tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Run Core Tests (No External Sites)
      run: |
        cd visualiser
        python ./manage.py test \
          --exclude-tag=wikipedia_live \
          --exclude-tag=backstabbr \
          --exclude-tag=webdip \
          --exclude-tag=wdr \
          --exclude-tag=wdd

  parser-sites-ci-py312:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Run Backstabbr and WebDiplomacy Tests
      run: |
        cd visualiser
        python ./manage.py test \
          --tag=backstabbr \
          --tag=webdip
