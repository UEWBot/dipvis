name: Wikipedia Live Integration

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  wikipedia-live:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Live Wikipedia Tests
        run: |
          cd visualiser
          python ./manage.py test --tag=wikipedia_live
